events {}
http {
    upstream app{
        server helloagain-3-uyww.onrender.com:443;
        server helloagain-2-hatm.onrender.com:443;
        server helloagain-e3nk.onrender.com:443;
    }

    server {
        listen 1000;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}