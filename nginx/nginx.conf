events {}

http {
    log_format proxy_debug
        '$request status=$status '
        'upstream="$upstream_addr" '
        'upstream_status="$upstream_status" '
        'connect_time="$upstream_connect_time"';

    access_log /dev/stdout proxy_debug;
    error_log /dev/stderr info;
    upstream app {
        server 127.0.0.1:2001;
        server 127.0.0.1:2002;
        server 127.0.0.1:2003;
    }

    server {
        listen 10000;

        location / {
            proxy_pass http://127.0.0.1:2001;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 127.0.0.1:2001;

        location / {
            proxy_pass https://helloagain-3-uyww.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_name helloagain-3-uyww.onrender.com;
            proxy_set_header Host helloagain-3-uyww.onrender.com;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 127.0.0.1:2002;

        location / {
            proxy_pass https://helloagain-2-hatm.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_name helloagain-2-hatm.onrender.com;
            proxy_set_header Host helloagain-2-hatm.onrender.com;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 127.0.0.1:2003;

        location / {
            proxy_pass https://helloagain-e3nk.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_name helloagain-e3nk.onrender.com;
            proxy_set_header Host helloagain-e3nk.onrender.com;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}