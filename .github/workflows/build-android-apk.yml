name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'client-android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client-android/package-lock.json'

      - name: Install Dependencies
        working-directory: ./client-android
        run: npm ci

      - name: Build Web Assets & Sync Native Android
        working-directory: ./client-android
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        working-directory: ./client-android/android
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Gradle
        working-directory: ./client-android/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloAgain-Messenger-Android-APK
          path: client-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
